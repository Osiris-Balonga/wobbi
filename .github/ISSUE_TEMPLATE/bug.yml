name: Bug
description: Report a reproducible behavior
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the minimum steps and attach a JSON project if needed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, operating system, Node.js version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
